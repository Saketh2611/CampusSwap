services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusswap}
      POSTGRES_USER: ${POSTGRES_USER:-campusswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusswap_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusswap}:${POSTGRES_PASSWORD:-campusswap_dev_password}@postgres:5432/${POSTGRES_DB:-campusswap}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-campus-swap-super-secure-dev-jwt-secret-2025}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
